name: Lint Archive Entries

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test archive linter
        run: go test ./cmd/lint-archives

      - name: Lint archive entries
        run: go run ./cmd/lint-archives
