name: IA TLS packet isolation
on: push
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare destinations and runner networks
        shell: bash
        run: |
          mkdir -p evidence
          { date -u; uname -a; ifconfig || true; netstat -rn; } > evidence/environment.txt
          if [[ $(uname) == Linux ]]; then
            sudo ethtool -K eth0 tso off gso off gro off || true
            for iface in /sys/class/net/eth0/lower_*; do sudo ethtool -K "${iface##*lower_}" tso off gso off gro off || true; done
            dev=eth0
          else
            dev=$(route -n get 145.116.0.213 | awk '/interface:/{print $2}')
          fi
          filter=$(python3 diagnostics/destinations.py --filter)
          sudo tcpdump -i "$dev" -s 0 -U -w evidence/destinations.pcap "$filter" > evidence/tcpdump.log 2>&1 &
          cap=$!
          trap 'sudo kill -INT "$cap" || true; wait "$cap" || true' EXIT
          sleep 1
          python3 diagnostics/destinations.py | tee evidence/destinations.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-destinations-${{ matrix.os }}
          path: evidence/
