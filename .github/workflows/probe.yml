name: IA TLS packet isolation
on: push
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Try hop localization from macOS runner
        shell: bash
        run: |
          mkdir -p evidence
          { date -u; uname -a; ifconfig; netstat -rn; } > evidence/environment.txt
          curl -4fsS --max-time 10 https://api.ipify.org > evidence/egress-ip.txt || true
          dev=$(route -n get 145.116.0.213 | awk '/interface:/{print $2}')
          sudo sh -c 'echo $$ > evidence/tcpdump.pid; exec tcpdump -i "$1" -s 0 -U -w evidence/locate.pcap "(host 145.116.0.213) or icmp"' sh "$dev" > evidence/tcpdump.log 2>&1 &
          trap 'sudo kill -INT "$(cat evidence/tcpdump.pid)" || true; sleep 1; sudo kill -TERM "$(cat evidence/tcpdump.pid)" 2>/dev/null || true' EXIT
          sleep 1
          sudo python3 -u diagnostics/locate.py --wait .5 | tee evidence/locate.jsonl
          traceroute -n -m 26 -w 1 -q 1 145.116.0.213 > evidence/traceroute.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-mac-locate
          path: evidence/
