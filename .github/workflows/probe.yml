name: Diagnose IA download
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Check IA endpoints with curl
        shell: bash
        run: |
          for url in \
            https://archive.org/download/ct_digicert_yeti2022_2/ct_digicert_yeti2022_2_archive.torrent \
            https://dn760103.eu.archive.org/0/items/ct_digicert_yeti2022_2/ct_digicert_yeti2022_2_archive.torrent \
            https://ia801402.us.archive.org/15/items/ct_digicert_yeti2022_2/ct_digicert_yeti2022_2_archive.torrent; do
            echo "Checking $url"
            curl -vL --max-time 40 -o /dev/null -w 'status=%{http_code} remote=%{remote_ip} tls=%{time_appconnect} total=%{time_total}\n' "$url" || true
          done
      - name: Check Go TLS variants
        shell: bash
        run: |
          cat > /tmp/probe.go <<'GO'
          package main
          import ("crypto/tls"; "fmt"; "io"; "net/http"; "time")
          func main() {
            for _, classic := range []bool{false,true} {
              tr := http.DefaultTransport.(*http.Transport).Clone()
              if classic { tr.TLSClientConfig = &tls.Config{CurvePreferences: []tls.CurveID{tls.X25519,tls.CurveP256}} }
              c := &http.Client{Transport:tr,Timeout:40*time.Second}
              for _, url := range []string{
                "https://dn760103.eu.archive.org/0/items/ct_digicert_yeti2022_2/ct_digicert_yeti2022_2_archive.torrent",
                "https://ia801402.us.archive.org/15/items/ct_digicert_yeti2022_2/ct_digicert_yeti2022_2_archive.torrent",
              } {
                start := time.Now()
                resp, err := c.Get(url)
                if err != nil { fmt.Printf("classic=%v url=%s elapsed=%v error=%v\n",classic,url,time.Since(start),err); continue }
                n,err := io.Copy(io.Discard,resp.Body); resp.Body.Close()
                fmt.Printf("classic=%v url=%s elapsed=%v status=%v bytes=%v error=%v\n",classic,url,time.Since(start),resp.Status,n,err)
              }
              tr.CloseIdleConnections()
            }
          }
          GO
          go run /tmp/probe.go
