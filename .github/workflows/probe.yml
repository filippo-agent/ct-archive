name: IA TLS packet isolation
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Localize packet-size loss with established TCP TTL probes
        shell: bash
        run: |
          mkdir -p evidence
          ip=$(getent ahostsv4 dn760103.eu.archive.org | awk 'NR==1{print $1}')
          { date -u; uname -a; ip addr; ip route; ip route get "$ip"; } > evidence/environment.txt
          sudo ethtool -K eth0 tso off gso off gro off
          for iface in /sys/class/net/eth0/lower_*; do sudo ethtool -K "${iface##*lower_}" tso off gso off gro off || true; done
          sudo tcpdump -i eth0 -s 0 -U -w evidence/locate.pcap "(host $ip and tcp) or icmp" > evidence/tcpdump.log 2>&1 &
          cap=$!
          trap 'sudo kill -INT "$cap" || true; wait "$cap" || true' EXIT
          sleep 1
          sudo python3 diagnostics/locate.py --ip "$ip" | tee evidence/locate.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-locate
          path: evidence/
