name: IA path MTU DF-bit control
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture DF-bit and exact size boundary
        run: |
          mkdir -p artifacts
          ip addr > artifacts/environment.txt
          ip route >> artifacts/environment.txt
          IP=$(getent ahostsv4 dn760103.eu.archive.org | awk 'NR==1 {print $1}')
          echo "DNS $IP; minimal Go program pins 145.116.0.213" | tee -a artifacts/environment.txt
          test "$IP" = 145.116.0.213
          sudo ethtool -K eth0 tso off gso off gro off >> artifacts/offload-changes.txt 2>&1 || true
          for interface in /sys/class/net/eth0/lower_*; do
            interface=${interface##*lower_}
            sudo ethtool -K "$interface" tso off gso off gro off >> artifacts/offload-changes.txt 2>&1 || true
          done
          sudo tcpdump -i any -nn -s 0 -U -w "$PWD/artifacts/ia.pcap" "(host $IP and (tcp port 443 or icmp)) or (icmp and icmp[0] = 3 and icmp[1] = 4 and icmp[24:4] = 0x917400d5)" -Z root > artifacts/tcpdump.txt 2>&1 &
          CAPTURE=$!
          trap 'sudo kill -INT "$CAPTURE"; wait "$CAPTURE" || true; sudo chmod -R a+r artifacts' EXIT
          sleep 1
          python3 diagnostics/tcp-repro.py --ip "$IP" --sizes 1438,1439,1440 | tee artifacts/tcp-repro.txt
          python3 diagnostics/tcp-repro.py --ip "$IP" --no-df --sizes 1440,1448,1529 --out artifacts/no-df.jsonl | tee artifacts/no-df.txt
          ping -n -M do -s 56 -c 2 -W 1 "$IP" > artifacts/ping-small.txt 2>&1 || true
          sudo sysctl -w net.ipv4.tcp_timestamps=0 | tee artifacts/timestamps-change.txt
          python3 diagnostics/tcp-repro.py --ip "$IP" --sizes 1450,1451,1452 --out artifacts/no-timestamps.jsonl | tee artifacts/no-timestamps.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-df-control
          path: artifacts/
          retention-days: 14
