name: IA TLS minimal and TCP reproducer
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Build Go 1.25.4 minimal reproducer
        run: |
          mkdir -p artifacts
          go version | tee artifacts/environment.txt
          go build -o /tmp/ia-minimal125 diagnostics/minimal.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build Go 1.27.1 minimal reproducer
        run: |
          go version | tee -a artifacts/environment.txt
          go build -o /tmp/ia-minimal127 diagnostics/minimal.go
          ip addr >> artifacts/environment.txt
          ip route >> artifacts/environment.txt
          sysctl net.ipv4.tcp_timestamps net.ipv4.tcp_mtu_probing >> artifacts/environment.txt
      - name: Capture minimal reproductions and size boundary
        run: |
          IP=$(getent ahostsv4 dn760103.eu.archive.org | awk 'NR==1 {print $1}')
          echo "DNS $IP; minimal Go program pins 145.116.0.213" | tee -a artifacts/environment.txt
          test "$IP" = 145.116.0.213
          sudo ethtool -K eth0 tso off gso off gro off >> artifacts/offload-changes.txt 2>&1 || true
          for interface in /sys/class/net/eth0/lower_*; do
            interface=${interface##*lower_}
            sudo ethtool -K "$interface" tso off gso off gro off >> artifacts/offload-changes.txt 2>&1 || true
          done
          sudo tcpdump -i any -nn -s 0 -U -w "$PWD/artifacts/ia.pcap" "(host $IP and (tcp port 443 or icmp)) or (icmp and icmp[0] = 3 and icmp[1] = 4 and icmp[24:4] = 0x917400d5)" -Z root > artifacts/tcpdump.txt 2>&1 &
          CAPTURE=$!
          trap 'sudo kill -INT "$CAPTURE"; wait "$CAPTURE" || true; sudo chmod -R a+r artifacts' EXIT
          sleep 1
          for binary in /tmp/ia-minimal125 /tmp/ia-minimal127; do
            echo "$binary default" | tee -a artifacts/minimal.txt
            GODEBUG= "$binary" | tee -a artifacts/minimal.txt
            echo "$binary tlsmlkem=0" | tee -a artifacts/minimal.txt
            GODEBUG=tlsmlkem=0 "$binary" | tee -a artifacts/minimal.txt
          done
          python3 diagnostics/tcp-repro.py --ip "$IP" | tee artifacts/tcp-repro.txt
          for size in 1452 1460 1464 1472; do
            ping -n -M do -s "$size" -c 2 -W 2 "$IP" >> artifacts/ping.txt 2>&1 || true
          done
          sudo sysctl -w net.ipv4.tcp_timestamps=0 | tee artifacts/timestamps-change.txt
          python3 diagnostics/tcp-repro.py --ip "$IP" --rounds 1 --sizes 1436,1440,1448,1452,1460,1529 --out artifacts/no-timestamps.jsonl | tee artifacts/no-timestamps.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-tls-minimal
          path: artifacts/
          retention-days: 14
